    <style>
        :root {

        body {
            margin: 0;
            /* font-family: "Computer Modern Sans", sans-serif; */
            font-family: "HelveticaNeue-Light", "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif;

        .sidebar {

            position: sticky;

            height: 100vh;
            overflow-y: auto;
        }

        .sidebar img {
            width: 100%;
            border-radius: 8px;
        }

        .sidebar>div:last-child {

            right: 20px;

        }

        .main {
            flex: 1;

            max-width: 700px;

            box-sizing: border-box;
        }

        h1,

            color: #ffffff;
            border-bottom: 1px solid #333c4d;
        }

        a {
            color: #5eaefc;
            text-decoration: none;
        }

        a:hover {
            color: #91caff;
            text-decoration: underline;
        }

        code,
        pre {
            background-color: #1b1d26;
            color: #f0f0f0;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #333c4d;
                text-align: center;
                position: static;
                height: auto;
                overflow-y: visible;
            }

            .sidebar>div:last-child {
                position: static;
                margin-top: 20px;
            }

            .sidebar img {
                width: 120px;
            }

            .main {
                padding: 20px;
            }
        }
