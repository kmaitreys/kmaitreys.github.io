{{ $src := .Get "src" | default (.Get 0) }}
{{ $title := .Get "title" | default "Figure" }}
{{ $caption := .Get "caption" | default (.Get 1) }}

<figure class="fig-bar">
  <div class="fig-bar-content">
    <div class="fig-bar-media">
      <img src="{{ $src }}" alt="{{ $caption | default $title }}">
      {{ if $caption }}
        <figcaption>{{ $caption }}</figcaption>
      {{ end }}
    </div>
  </div>
</figure>
