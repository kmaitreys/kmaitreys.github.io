{{ define "main" }}
<header class="page-header">
  <div class="header-title-group">
    <h1 class="title">{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Params.name }}{{ end }}</h1>
    <button class="theme-toggle btn-link">Switch Theme</button>
  </div>


</header>

<article>
  <main>
    {{ .Content }}
  </main>
</article>
{{ end }}
