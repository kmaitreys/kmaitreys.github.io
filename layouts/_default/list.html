{{ define "main" }}
<header class="page-header">
  <div class="header-title-group">
    <h1 class="title">{{ .Title }}</h1>
    {{ partial "theme-toggle.html" . }}
  </div>


</header>

<main>
  {{ .Content }}
  <ul class="posts">
    {{ range .Pages }}
    <li>
      <time>{{ .Lastmod.Format "2006-01-02" }}</time> — 
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</main>
{{ end }}
